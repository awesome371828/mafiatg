name: Mafia Keep — code checks

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/mafia_check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bot
        run: python -m py_compile main.py
      - name: Check data file
        run: python -m json.tool data.json > /dev/null
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Run game logic tests
        run: python -m unittest discover -s tests -v
